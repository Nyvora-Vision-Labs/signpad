[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signpad"
version = "0.1.0"
description = "Agent-assisted handwritten signing for .docx and .pdf documents, on your own computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nyvora Vision Labs" }]
keywords = ["e-signature", "signing", "agent", "claude", "docx", "pdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = [
  "anthropic>=2.8,<3",
  "lxml>=5.0",
  "mcp>=2.3,<3",
  "pypdf>=5.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
signpad = "signpad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signpad.pad" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP031"]  # "{%s}tag" % ns reads better than f-strings with braces for XML names
